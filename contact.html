  <!-- Shared site styles -->

  <style>
    :root{
      --bg:#000; --fg:#fff; --muted:#bfbfbf; --panel:#1a1a1a; --stroke:rgba(255,255,255,.08);
      --accent1:#00c2ff; --accent2:#2ee6b8;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
    }

    /* Canvas sits behind everything */
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Page content panel */
    section {
      position: relative;
      z-index: 2;
      max-width: 700px;
      margin: 84px auto;        /* space from header and bottom */
      padding: 30px 40px;       /* inside padding */
      background: var(--panel); /* dark panel to match site */
      border: 1px solid var(--stroke);
      border-radius: 14px;
      box-sizing: border-box;
      box-shadow: 0 0 30px rgba(0,0,0,.4);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p { color: var(--muted); }

    form {
      display: flex;
      flex-direction: column;
      max-width: 600px;
      margin-top: 1rem;
    }

    label {
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    input, textarea {
      margin-bottom: 1rem;
      padding: 0.7rem 1rem;
      border: 1px solid var(--stroke);
      border-radius: 8px;
      background: #0a0a0a;
      color: var(--fg);
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent1);
      box-shadow: 0 0 6px rgba(0,194,255,.4);
    }

    /* Button matches index behavior (gray base → blue–teal on hover with black text) */
    .btn {
      padding: 0.8rem 1.4rem;
      background: var(--panel);
      color: #fff;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 700;
      width: fit-content;
      transition:
        background .35s ease,
        box-shadow .35s ease,
        transform .15s ease,
        filter .25s ease,
        color .2s ease;
      background-size: 200% 100%;
      background-position: 0% 50%;
    }
    .btn:hover {
      background-image: linear-gradient(90deg, var(--accent1), var(--accent2));
      background-size: 200% 100%;
      animation: gradientShift 2.5s ease-in-out infinite alternate;
      box-shadow:
        0 0 12px rgba(0,194,255,.4),
        0 0 25px rgba(46,230,184,.25);
      transform: translateY(-2px);
      filter: brightness(1.05);
      color: #000; /* black text on hover */
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    /* --- Mobile-only tweaks --- */
    @media (max-width: 600px) {
      html, body { overflow-x: hidden; }

      section {
        margin: 56px auto;
        padding: 20px;
      }

      textarea {
        height: 100px;
      }

      .btn {
        width: 100%;
        align-self: center;
      }
    }
  </style>

<body>

  <script>
    // === Dots: same structure/format as your original, just color/brightness changed ===
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    let dots = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createDots() {
      dots = [];
      for (let i = 0; i < 500; i++) {
        // pick cyan or teal with slight transparency for a soft glow
        const color = Math.random() < 0.5
          ? 'rgba(0, 194, 255, 0.7)'   // cyan
          : 'rgba(46, 230, 184, 0.6)'; // teal

        dots.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() / 8 + 1,
          dx: Math.random() - 0.5,
          dy: Math.random() - 0.5,
          color
        });
      }
    }

    function drawDots() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let dot of dots) {
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2, false);
        ctx.fillStyle = dot.color; // blue–teal instead of white
        ctx.fill();
        ctx.closePath();
      }
    }

    function updateDots() {
      for (let dot of dots) {
        dot.x += dot.dx;
        dot.y += dot.dy;
        if (dot.x < 0 || dot.x > canvas.width || dot.y < 0 || dot.y > canvas.height) {
          dot.x = Math.random() * canvas.width;
          dot.y = Math.random() * canvas.height;
        }
      }
    }

    function animate() {
      drawDots();
      updateDots();
      requestAnimationFrame(animate);
    }

    // Hover responsiveness (same format)
    canvas.addEventListener('mousemove', (e) => {
      for (let dot of dots) {
        const rect = canvas.getBoundingClientRect();
        const dx = (e.clientX - rect.left) - dot.x;
        const dy = (e.clientY - rect.top) - dot.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 100) {
          dot.dx = dx / distance;
          dot.dy = dy / distance;
        }
      }
    });

    createDots();
    animate();
  </script>
</body>
