<section>
    <h2>Contact Me</h2>
    <form onsubmit="sendEmail(event)">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="10" required></textarea>

        <button type="submit">Send</button>
    </form>
</section>
<script>
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');
    let dots = [];

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createDots() {
        dots = [];
        for (let i = 0; i < 500; i++) { // Increase the number of dots
            dots.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random()/8 + 1,
                dx: Math.random() - 0.5,
                dy: Math.random() - 0.5
            });
        }
    }

    function drawDots() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let dot of dots) {
            ctx.beginPath();
            ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2, false);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.closePath();
        }
    }

    function updateDots() {
        for (let dot of dots) {
            dot.x += dot.dx;
            dot.y += dot.dy;
            if (dot.x < 0 || dot.x > canvas.width || dot.y < 0 || dot.y > canvas.height) {
                dot.x = Math.random() * canvas.width;
                dot.y = Math.random() * canvas.height;
            }
        }
    }

    function animate() {
        drawDots();
        updateDots();
        requestAnimationFrame(animate);
    }

    canvas.addEventListener('mousemove', (e) => {
    for (let dot of dots) {
            const dx = e.clientX - dot.x;
            const dy = e.clientY - dot.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 100) {
                dot.dx = dx / distance; // Minimal reactivity
                dot.dy = dy / distance;
            }
        }
    });

    createDots();
    animate();
</script>
