<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddharth Chattoraj: Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/jpeg" href="images/your_photo.jpg">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        section {
            position: relative;
            z-index: 2;
            max-width: 700px;
            margin: 40px auto;         /* space from nav and bottom */
            padding: 30px 40px;        /* inside padding */
            background: #fff;          /* solid white */
            border-radius: 10px;
            box-sizing: border-box;
        }

        h2, p, form {
            text-align: left;
        }

        form {
            display: flex;
            flex-direction: column;
            max-width: 600px;
        }

        label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        input, textarea {
            margin-bottom: 1rem;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 120px;
        }

        button {
            padding: 0.75rem 1.5rem;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            width: fit-content;  /* left-aligned */
        }

        /* --- Mobile-only tweaks --- */
        @media (max-width: 600px) {
            html, body { overflow-x: hidden; }

            section {
                margin: 20px auto;
                padding: 20px;
            }

            textarea {
                height: 100px;
            }

            button {
                width: 100%;
                align-self: center;
            }
        }
    </style>
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("XtKpGeCI22dGIwKPs");
        })();
        
        function sendEmail(e) {
            e.preventDefault();
            emailjs.sendForm('service_9lmfwgo', 'template_vrtic4a', e.target)
                .then(function() {
                    alert('Email sent successfully!');
                }, function(error) {
                    alert('Failed to send email: ' + JSON.stringify(error));
                });
        }
    </script>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <header>
        <h1>Siddharth Chattoraj</h1>
        <nav>
            <a href="index">Home</a>
            <a href="design">Design</a>
            <a href="fabrication">Fabrication</a>
            <a href="contact">Contact</a>
        </nav>
    </header>
    <section>
        <h2>Contact Me</h2>
        <p><b>Email:</b> siddharthchattoraj [at] gmail [dot] com<br><b>Phone:</b> (408)-747-9587</p>
        <form onsubmit="sendEmail(event)">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>
    <script>
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createDots() {
            dots = [];
            for (let i = 0; i < 500; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random()/8 + 1,
                    dx: Math.random() - 0.5,
                    dy: Math.random() - 0.5
                });
            }
        }
        function drawDots() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let dot of dots) {
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.closePath();
            }
        }
        function updateDots() {
            for (let dot of dots) {
                dot.x += dot.dx;
                dot.y += dot.dy;
                if (dot.x < 0 || dot.x > canvas.width || dot.y < 0 || dot.y > canvas.height) {
                    dot.x = Math.random() * canvas.width;
                    dot.y = Math.random() * canvas.height;
                }
            }
        }
        function animate() {
            drawDots();
            updateDots();
            requestAnimationFrame(animate);
        }
        canvas.addEventListener('mousemove', (e) => {
            for (let dot of dots) {
                const dx = e.clientX - dot.x;
                const dy = e.clientY - dot.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    dot.dx = dx / distance;
                    dot.dy = dy / distance;
                }
            }
        });
        createDots();
        animate();
    </script>
</body>
</html>
