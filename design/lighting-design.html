<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddharth Chattoraj: Lighting Design</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <style>
        html, body {
            background-color: black;
            color: white;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        header {
            background: black;
        }
        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }
        .main-content h2 {
            font-size: 2.5rem;
            color: white;
            text-align: center;
            margin-top: 0px;
        }
        .production {
            text-align: center;
        }
        .production h3 {
            font-size: 2rem;
            margin-bottom: 1rem;
            margin-top: 0px;
        }
        .production .buttons {
            margin: 1rem 0;
        }
        .production .buttons button {
            padding: 0.75rem 1.5rem;
            margin: 0.5rem;
            background-color: #333; /* Menu color */
            color: #fff;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            font-size: 1rem;
        }
        .production .buttons button:hover {
            background-color: #555; /* Slightly lighter background on hover */
        }
        .swiper-container {
            width: 75%;
            max-width: 1000px;
            margin: auto;
            position: relative;
            padding: 26px 0;
            overflow: hidden;
        }
        .swiper-slide img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .swiper-pagination-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 35px;
        }
        .swiper-pagination {
            order: 2; /* Ensure pagination is in the middle */
            margin: 0 15px;
        }
        .swiper-button-next, .swiper-button-prev {
            color: white;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .swiper-button-prev {
            order: 1;
        }
        .swiper-button-next {
            order: 3;
        }
        section {
            top: -100px;
            position: relative;
            max-width: 1000px;
            z-index: 2;
            background-color: black;
            background: black;
        }
    </style>
</head>
<body>
    <header>
        <h1>Siddharth Chattoraj</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../about.html">About</a>
            <a href="../resume.html">Resume</a>
            <a href="../data-science.html">Data Science</a>
            <div class="dropdown">
                <span>Design</span>
                <div class="dropdown-content">
                    <a href="fabrication-painting.html">Fabrication/Painting</a>
                    <a href="lighting-design.html">Lighting</a>
                    <a href="projections-video.html">Projections/Video</a>
                </div>
            </div>
            <a href="../contact.html">Contact</a>
        </nav>
    </header>
    <section>
        <div class="main-content">
            <h2>Lighting Design Portfolio</h2>

            <div class="production">
                <h3>Inopia</h3>
                <div class="buttons">
                    <button>Research</button>
                    <button>Full Video</button>
                </div>
                <p>Short Description of Production 1</p>
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 1.png" alt="Production 1 Image 1"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 2.png" alt="Production 1 Image 2"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 3.png" alt="Production 1 Image 3"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 4.png" alt="Production 1 Image 4"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 5.png" alt="Production 1 Image 5"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 6.png" alt="Production 1 Image 6"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 7.png" alt="Production 1 Image 7"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 8.png" alt="Production 1 Image 8"></div>
                        <div class="swiper-slide"><img src="../lighting-images/Inopia/Siddharth Chattoraj Inopia Pictures/Siddharth Chattoraj Inopia Image 9.png" alt="Production 1 Image 9"></div>
                    </div>
                    <!-- Add Pagination and Navigation inside a container -->
                    <div class="swiper-pagination-container">
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-pagination"></div>
                        <div class="swiper-button-next"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        var swiper = new Swiper('.swiper-container', {
            slidesPerView: 1,
            spaceBetween: 10,
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                type: 'fraction',
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            freeMode: false, 
            shortSwipes: false,
        });
    </script>
</body>
</html>
