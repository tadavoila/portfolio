<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siddharth Chattoraj: Home</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" type="image/jpeg" href="images/your_photo.jpg">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Layout for main section */
        .main-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding: 0 40px;
            position: relative;
            z-index: 2;
        }
        .main-content > div {
            flex: 1;
        }
        .main-content img {
            flex: 1;
            max-width: 300px;
            border-radius: 50%;
            display: block;
        }

        /* Buttons group */
        .actions {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .actions button {
            margin: 0; /* removes extra left indent */
            padding: 0.75rem 1.5rem;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* Social icons */
        .socials {
            margin-top: 1rem;
        }
        .socials a {
            margin-right: 10px;
            font-size: 1.5rem;
            color: black;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            html, body { overflow-x: hidden; }

            .main-content {
                flex-direction: column; /* stack on phones */
                text-align: center;
                gap: 20px;
                padding: 0 16px;
            }
            .main-content img {
                max-width: 200px;
            }

            /* Optional: block the second half of text without <br> */
            .mobile-block {
                display: block;
            }

            .actions {
                justify-content: center; /* center buttons on mobile */
            }
        }
    </style>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>

    <header>
        <h1>Siddharth Chattoraj</h1>
        <nav>
            <a href="index">Home</a>
            <a href="lighting">Lighting Design</a>
            <a href="projections">Projection Design</a>
            <a href="fabrication">Fabrication Design</a>
            <a href="contact">Contact</a>
        </nav>
    </header>

    <section>
        <div class="main-content">
            <div>
                <h2>Hi There, I'm Siddharth!</h2>
                <p>
                    I am a visual media designer and storyteller. Please navigate above to view
                    <span class="mobile-block">my design portfolios and click the buttons below to view my experience.</span>
                </p>

                <!-- fixed button alignment -->
                <div class="actions">
                    <a href="cv-files/siddharth_chattoraj_cv.pdf" target="_blank"><button>CV</button></a>
                    <a href="cv-files/siddharth_chattoraj_design_resume.pdf" target="_blank"><button>Design Resume</button></a>
                </div>

                <div class="socials">
                    <a href="https://www.linkedin.com/in/siddharth-chattoraj-53269010a/" class="fab fa-linkedin"></a>
                    <a href="https://github.com/tadavoila" class="fab fa-github"></a>
                    <a href="mailto:schattoraj@ucsb.edu" class="fas fa-envelope"></a>
                </div>
            </div>

            <img src="images/your_photo.jpg" alt="Your Photo">
        </div>
    </section>

    <script>
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');
        let dots = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createDots() {
            dots = [];
            for (let i = 0; i < 500; i++) {
                dots.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random()/8 + 1,
                    dx: Math.random() - 0.5,
                    dy: Math.random() - 0.5
                });
            }
        }
        function drawDots() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let dot of dots) {
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2, false);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.closePath();
            }
        }
        function updateDots() {
            for (let dot of dots) {
                dot.x += dot.dx;
                dot.y += dot.dy;
                if (dot.x < 0 || dot.x > canvas.width || dot.y < 0 || dot.y > canvas.height) {
                    dot.x = Math.random() * canvas.width;
                    dot.y = Math.random() * canvas.height;
                }
            }
        }
        function animate() {
            drawDots();
            updateDots();
            requestAnimationFrame(animate);
        }
        canvas.addEventListener('mousemove', (e) => {
            for (let dot of dots) {
                const dx = e.clientX - dot.x;
                const dy = e.clientY - dot.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 100) {
                    dot.dx = dx / distance;
                    dot.dy = dy / distance;
                }
            }
        });
        createDots();
        animate();

        function toggleMenu(menuId, toggleId) {
            const menu = document.getElementById(menuId);
            const toggle = document.getElementById(toggleId);
            if (!menu || !toggle) return;
            toggle.addEventListener('click', () => menu.classList.toggle('show'));
            toggle.addEventListener('mouseenter', () => menu.classList.add('show'));
            toggle.addEventListener('mouseleave', () => menu.classList.remove('show'));
            menu.addEventListener('mouseenter', () => menu.classList.add('show'));
            menu.addEventListener('mouseleave', () => menu.classList.remove('show'));
        }
        toggleMenu('dataScienceMenu', 'dataScienceToggle');
        toggleMenu('designMenu', 'designToggle');
    </script>
</body>
</html>
